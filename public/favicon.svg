<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0077ff" />
    </linearGradient>
    <linearGradient id="neonAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ff3366" />
    </linearGradient>
    <linearGradient id="bgPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121826" />
      <stop offset="100%" stop-color="#06080d" />
    </linearGradient>
    
    <!-- Neon Glow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Shield Base with Cyber Accents -->
  <rect x="25" y="25" width="450" height="450" rx="90" fill="url(#bgPlate)" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
  <rect x="40" y="40" width="420" height="420" rx="75" fill="none" stroke="url(#neonCyan)" stroke-width="2" stroke-dasharray="16 8" opacity="0.35"/>

  <!-- 3D Print Build Platform Base Plate -->
  <path d="M120 380 L380 380 L350 410 L150 410 Z" fill="#1b2438" stroke="url(#neonCyan)" stroke-width="3"/>
  <line x1="160" y1="395" x2="340" y2="395" stroke="#00f0ff" stroke-width="2" opacity="0.6"/>

  <!-- Stylized Letter 'P' for PRINT (Laser & 3D Layer lines) -->
  <g filter="url(#cyanGlow)">
    <!-- Vertical Spine -->
    <rect x="145" y="110" width="34" height="235" rx="12" fill="url(#neonCyan)"/>
    <!-- P Head with Precision 3D Layer Slices -->
    <path d="M175 110 H260 C305 110, 335 135, 335 180 C335 225, 305 250, 260 250 H175 Z" 
          fill="none" stroke="url(#neonCyan)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- 3D Print Layer Lines inside P -->
    <line x1="190" y1="150" x2="280" y2="150" stroke="#ffffff" stroke-width="4" opacity="0.8"/>
    <line x1="190" y1="175" x2="295" y2="175" stroke="#ffffff" stroke-width="4" opacity="0.9"/>
    <line x1="190" y1="200" x2="290" y2="200" stroke="#ffffff" stroke-width="4" opacity="0.8"/>
    <line x1="190" y1="225" x2="265" y2="225" stroke="#ffffff" stroke-width="4" opacity="0.7"/>
  </g>

  <!-- Crossing Masterclass Paintbrush for PAINT -->
  <g filter="url(#amberGlow)" transform="rotate(35 250 250)">
    <!-- Brush Handle -->
    <path d="M236 60 L264 60 L258 260 L242 260 Z" fill="#2d1d36" stroke="#4a3055" stroke-width="2"/>
    <!-- Metal Ferrule -->
    <rect x="238" y="260" width="24" height="60" rx="3" fill="#8892b0" stroke="#ccd6f6" stroke-width="2"/>
    <line x1="238" y1="280" x2="262" y2="280" stroke="#475569" stroke-width="2"/>
    <line x1="238" y1="300" x2="262" y2="300" stroke="#475569" stroke-width="2"/>
    <!-- Brush Bristles with Neon Flame Tip -->
    <path d="M239 320 C239 370, 245 410, 250 435 C255 410, 261 370, 261 320 Z" fill="url(#neonAmber)"/>
    <!-- Fluid Paint Splash Droplet -->
    <circle cx="250" cy="455" r="7" fill="#ff7700"/>
  </g>

  <!-- Glowing Core Energy Sparks -->
  <circle cx="340" cy="180" r="10" fill="#00f0ff" filter="url(#cyanGlow)"/>
  <circle cx="130" cy="360" r="5" fill="#ff7700" filter="url(#amberGlow)"/>
  <circle cx="370" cy="360" r="6" fill="#00f0ff" filter="url(#cyanGlow)"/>
</svg>
